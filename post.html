<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog — Elijah Senabulya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0E1B38; --navy-2:#16264A; --sky:#2F9FE8; --sky-bright:#56B8FF;
    --purple:#6C4FC7; --ink:#131B2C; --muted:#68707E; --border:#E6E8EC;
    --bg:#FFFFFF; --bg-soft:#F5F7FA;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--ink); font-family:'Plus Jakarta Sans', sans-serif; line-height:1.7; -webkit-font-smoothing:antialiased;}
  a{color:inherit; text-decoration:none;}
  .wrap{max-width:760px; margin:0 auto; padding:0 24px;}
  header{background:#fff; border-bottom:1px solid var(--border);}
  nav.wrap{display:flex; align-items:center; justify-content:space-between; height:76px; max-width:1120px;}
  .brand{display:flex; align-items:center; gap:10px; font-weight:800; font-size:16px;}
  .brand img{width:36px; height:36px; border-radius:50%; object-fit:cover; border:2px solid var(--sky);}
  .back{font-size:13.5px; font-weight:700; color:var(--sky);}
  article{padding:64px 0 40px;}
  .blog-meta{display:flex; align-items:center; gap:10px; margin-bottom:18px;}
  .blog-tag{background:var(--bg-soft); color:var(--navy); font-size:10.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; padding:5px 10px; border-radius:8px;}
  .blog-date{font-size:12.5px; color:var(--muted); font-weight:600;}
  h1{font-size:clamp(28px,4.5vw,42px); font-weight:800; letter-spacing:-0.01em; margin-bottom:24px; line-height:1.15;}
  .content p{color:#3B4353; font-size:16.5px; font-weight:500; margin-bottom:20px;}
  .not-found{padding:100px 0; text-align:center; color:var(--muted);}
  footer{background:var(--navy); color:#9FAAC2; padding:36px 0; text-align:center; font-size:12.5px; margin-top:40px;}
</style>
</head>
<body>

<header>
  <nav class="wrap">
    <a href="index.html" class="brand"><img src="images/headshot.jpg" alt="Elijah Senabulya">Elijah Senabulya</a>
    <a href="index.html#blog" class="back">← Back to Blog</a>
  </nav>
</header>

<article class="wrap" id="postRoot">
  <p style="color:var(--muted); padding-top:40px;">Loading post…</p>
</article>

<footer>© 2026 Elijah Senabulya. Kampala, Uganda.</footer>

<script>
  const params = new URLSearchParams(window.location.search);
  const slug = params.get('slug');
  const root = document.getElementById('postRoot');

  fetch('/api/posts')
    .then(r => r.json())
    .then(posts => {
      const post = posts.find(p => p.slug === slug);
      if(!post){
        root.innerHTML = '<div class="not-found"><h1>Post not found</h1><p><a href="index.html#blog" style="color:var(--sky); font-weight:700;">← Back to Blog</a></p></div>';
        return;
      }
      document.title = post.title + ' — Elijah Senabulya';
      const dateStr = new Date(post.date).toLocaleDateString('en-GB', {day:'numeric', month:'long', year:'numeric'});
      const paragraphs = post.content.split(/\n\s*\n/).map(p => `<p>${p.trim()}</p>`).join('');
      root.innerHTML = `
        <div class="blog-meta">
          <span class="blog-tag">${post.tag || 'Post'}</span>
          <span class="blog-date">${dateStr}</span>
        </div>
        <h1>${post.title}</h1>
        <div class="content">${paragraphs}</div>
      `;
    })
    .catch(() => {
      root.innerHTML = '<div class="not-found"><h1>Could not load post</h1></div>';
    });
</script>

</body>
</html>
